<line x1="97" y1="160" x2="292" y2="160" class="msg"/><text x="194" y="150" text-anchor="middle">SetUIValue(gameStarted, true)</text><line x1="292" y1="210" x2="487" y2="210" class="msg"/><text x="389" y="200" text-anchor="middle">SetValue: compare + dirty</text><line x1="97" y1="270" x2="682" y2="270" class="msg"/><text x="389" y="260" text-anchor="middle">RefreshUI → GetRenderedHTML</text><line x1="682" y1="330" x2="877" y2="330" class="msg"/><text x="779" y="320" text-anchor="middle">Evaluate(state) if dirty</text><line x1="877" y1="390" x2="682" y2="390" class="msg"/><text x="779" y="380" text-anchor="middle">complete HTML + handler map</text><line x1="682" y1="440" x2="487" y2="440" class="msg"/><text x="584" y="430" text-anchor="middle">ClearDirty</text><line x1="682" y1="500" x2="1080" y2="500" class="msg"/><text x="881" y="490" text-anchor="middle">UpdateHTML(cached HTML)</text><line x1="1080" y1="560" x2="1290" y2="560" class="msg"/><text x="1185" y="550" text-anchor="middle">signal worker</text><line x1="1290" y1="620" x2="1080" y2="620" class="msg"/><text x="1185" y="610" text-anchor="middle">swap pixels + bounds</text>
