<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#334155"/></marker><style>text{font:14px system-ui;fill:#0f172a}.h{font-weight:700;font-size:18px}.head{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.life{stroke:#94a3b8;stroke-dasharray:6 5}.msg{stroke:#334155;stroke-width:2;marker-end:url(#a)}.fallback{fill:#fff7ed;stroke:#ea580c}</style></defs><rect width="1400" height="760" fill="white"/><text x="30" y="32" class="h">START GAME click: primary and fallback paths</text>
<g><rect x="25" y="60" width="145" height="48" rx="7" class="head"/><text x="97" y="90" text-anchor="middle">User / GLFW</text><rect x="220" y="60" width="155" height="48" rx="7" class="head"/><text x="297" y="90" text-anchor="middle">WindowManager</text><rect x="425" y="60" width="175" height="48" rx="7" class="head"/><text x="512" y="90" text-anchor="middle">HTMLRendererMT</text><rect x="650" y="60" width="155" height="48" rx="7" class="head"/><text x="727" y="90" text-anchor="middle">ReactiveUI</text><rect x="855" y="60" width="155" height="48" rx="7" class="head"/><text x="932" y="90" text-anchor="middle">game.lua method</text><rect x="1060" y="60" width="155" height="48" rx="7" class="head"/><text x="1137" y="90" text-anchor="middle">GameLogic</text><rect x="1260" y="60" width="115" height="48" rx="7" class="head"/><text x="1317" y="90" text-anchor="middle">UI state</text></g>
<g class="life"><line x1="97" y1="108" x2="97" y2="700"/><line x1="297" y1="108" x2="297" y2="700"/><line x1="512" y1="108" x2="512" y2="700"/><line x1="727" y1="108" x2="727" y2="700"/><line x1="932" y1="108" x2="932" y2="700"/><line x1="1137" y1="108" x2="1137" y2="700"/><line x1="1317" y1="108" x2="1317" y2="700"/></g>
<line x1="97" y1="155" x2="297" y2="155" class="msg"/><text x="197" y="145" text-anchor="middle">GLFW_PRESS at x/y</text><line x1="297" y1="215" x2="512" y2="215" class="msg"/><text x="404" y="205" text-anchor="middle">C++ UI handler (LIFO)</text><line x1="512" y1="275" x2="512" y2="315" class="msg"/><text x="525" y="298">scale + reverse hit-test bounds</text><line x1="512" y1="350" x2="727" y2="350" class="msg"/><text x="619" y="340" text-anchor="middle">DispatchEvent(click, onStartGame)</text><line x1="727" y1="410" x2="932" y2="410" class="msg"/><text x="829" y="400" text-anchor="middle">methods.onStartGame(state)</text><line x1="932" y1="470" x2="1137" y2="470" class="msg"/><text x="1034" y="460" text-anchor="middle">start("standard")</text><line x1="1137" y1="530" x2="1317" y2="530" class="msg"/><text x="1227" y="520" text-anchor="middle">SetUIValue(...)</text><line x1="1137" y1="590" x2="727" y2="590" class="msg"/><text x="932" y="580" text-anchor="middle">RefreshUI</text><line x1="512" y1="640" x2="297" y2="640" class="msg"/><text x="404" y="630" text-anchor="middle">true: click consumed</text>
<rect x="180" y="675" width="1040" height="55" rx="9" class="fallback"/><text x="700" y="698" text-anchor="middle">Fallback only: if no C++ handler consumes the click, WindowManager appends it to Lua EventQueue;</text><text x="700" y="719" text-anchor="middle">GameInput.lua later calls HandleClickEvent. This is not the successful button’s primary route.</text></svg>
