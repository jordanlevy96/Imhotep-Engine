<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker><style>text{font:15px system-ui;fill:#0f172a}.h{font-weight:700;font-size:20px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.worker{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.edge{stroke:#64748b;stroke-width:2;marker-end:url(#a)}.note{fill:#fff7ed;stroke:#ea580c}</style></defs><rect width="1400" height="520" fill="white"/><text x="35" y="35" class="h">Reactive UI structure and data flow</text>
<rect x="30" y="90" width="190" height="85" rx="9" class="box"/><text x="125" y="120" text-anchor="middle">game.html + CSS</text><text x="125" y="144" text-anchor="middle">game.lua state</text>
<rect x="275" y="90" width="190" height="85" rx="9" class="box"/><text x="370" y="120" text-anchor="middle">InitializeUI</text><text x="370" y="144" text-anchor="middle">load + bind</text>
<rect x="520" y="65" width="210" height="70" rx="9" class="box"/><text x="625" y="95" text-anchor="middle">LuaUIState</text><text x="625" y="118" text-anchor="middle">table + dirty flag</text>
<rect x="520" y="165" width="210" height="85" rx="9" class="box"/><text x="625" y="195" text-anchor="middle">TemplateParser</text><text x="625" y="219" text-anchor="middle">Gumbo template tree</text>
<rect x="785" y="90" width="215" height="110" rx="9" class="box"/><text x="892" y="120" text-anchor="middle">ReactiveUI cache</text><text x="892" y="145" text-anchor="middle">evaluated HTML</text><text x="892" y="170" text-anchor="middle">+ handler map</text>
<rect x="1055" y="75" width="300" height="250" rx="12" class="worker"/><text x="1075" y="107" class="h">HTML render thread</text><rect x="1085" y="135" width="240" height="65" rx="8" class="box"/><text x="1205" y="162" text-anchor="middle">litehtml document</text><text x="1205" y="184" text-anchor="middle">parse + CSS layout</text><rect x="1085" y="230" width="240" height="65" rx="8" class="box"/><text x="1205" y="257" text-anchor="middle">RGBA pixels + event bounds</text><text x="1205" y="280" text-anchor="middle">mutex-protected swap</text>
<rect x="785" y="350" width="570" height="80" rx="9" class="box"/><text x="1070" y="380" text-anchor="middle">Main thread: upload front buffer → OpenGL texture → composite overlay</text><text x="1070" y="405" text-anchor="middle">world geometry is rendered separately underneath</text>
<rect x="280" y="330" width="430" height="120" rx="9" class="note"/><text x="495" y="362" text-anchor="middle" class="h">Current behavior</text><text x="495" y="390" text-anchor="middle">Full HTML string and full litehtml document per refresh.</text><text x="495" y="416" text-anchor="middle">No live DOM diff or dirty-region renderer.</text>
<line x1="220" y1="132" x2="275" y2="132" class="edge"/><line x1="465" y1="120" x2="520" y2="100" class="edge"/><line x1="465" y1="145" x2="520" y2="195" class="edge"/><line x1="625" y1="135" x2="625" y2="165" class="edge"/><line x1="730" y1="205" x2="785" y2="155" class="edge"/><line x1="1000" y1="145" x2="1085" y2="167" class="edge"/><line x1="1205" y1="200" x2="1205" y2="230" class="edge"/><line x1="1205" y1="325" x2="1205" y2="350" class="edge"/>
